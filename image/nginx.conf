# Smart SubConverter 镜像入口 nginx（容器内 80，唯一对外端口）
# 路由契约见 docs/implementation/api-contract.md「nginx 路由」节：
#   /                       → 前端静态文件
#   /api/                   → sidecar（127.0.0.1:8081）
#   /s/                     → sidecar 短链订阅代理（127.0.0.1:8081，v1.2.0）
#   /sub /version /healthz  → SubConverter-Extended（127.0.0.1:25500，仅容器内）
#   /sub 为 deprecated 遗留兼容路由（v1.2.0 起契约不再为其新增行为）
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # 前端静态资源 gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 前端静态资源 + SPA 回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # sidecar：Host 与 X-Forwarded-Proto 必须显式透传（R3-1：origin 推导依据）
        # 注意用 $http_host 而非 $host：$host 去端口，非 80 端口部署时生成的 /sub 链接会缺端口
        # access_log off：/api/ 请求体可能含订阅 URL 凭据（D6 日志卫生）
        location /api/ {
            access_log off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8081;
        }

        # 短链订阅代理（v1.2.0）：GET /s/{code}，sidecar 查表命中后容器内代理 Extended
        # access_log off：短码即 bearer 凭据，与 /api/、/sub 同级对待（D6 日志卫生 + OH-2）
        location /s/ {
            access_log off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8081;
        }

        # Extended 直通路由；/sub 为 deprecated 遗留兼容路由（行为不变，存量长链接照常可用）；
        # query 含订阅凭据，关闭 access_log（D6）
        location = /sub {
            access_log off;
            proxy_pass http://127.0.0.1:25500;
        }

        location = /version {
            proxy_pass http://127.0.0.1:25500;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:25500;
        }
    }
}
