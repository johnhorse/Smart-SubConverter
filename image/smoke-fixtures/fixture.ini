[custom]
; 冒烟测试最小远端配置：与上游 ACL4SSR_Online.ini 同构的可裁剪片段
; （1 个 select 组 + 1 个 url-test 组 + 直连与兜底规则；FINAL 由 Extended 按目标客户端适配）
custom_proxy_group=🚀 节点选择 = select, ♻️ 自动选择, .*
custom_proxy_group=♻️ 自动选择 = url-test, .*
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🚀 节点选择,[]FINAL
