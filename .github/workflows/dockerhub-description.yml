name: dockerhub-description

# Docker Hub 镜像页（Overview 长文 + 顶部短描述）与 README 保持同步：
# - README.md 合入 main 时自动更新
# - 支持手动触发（Actions 页面 Run workflow，立即生效）
# 复用 build.yml 的 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，不新增凭据
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md']

permissions:
  contents: read

env:
  IMAGE_NAME: smart-subconverter
  SHORT_DESCRIPTION: '自托管「零选项」订阅转换服务：朋友粘贴订阅链接 → 点一下 → 拿走能直接用的配置。单容器 Docker 部署，短链不泄露凭据，规则快照内置不卡 GitHub。'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker Hub 只渲染单文件 markdown：把 README 里的仓库相对链接
      # （docs/xxx.md、LICENSE）改写成 GitHub 绝对 URL，避免镜像页死链
      - name: 生成镜像页专用 README
        run: |
          sed -E \
            -e "s|\]\((docs/[^)#]*)(#[^)]*)?\)|](https://github.com/${GITHUB_REPOSITORY}/blob/main/\1\2)|g" \
            -e "s|\]\((LICENSE)\)|](https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE)|g" \
            README.md > README.hub.md
          if grep -nP '\]\((?!https?://|#|mailto:)[^)]+\)' README.hub.md; then
            echo "::error::存在未改写为绝对 URL 的相对链接（上方 grep 输出）"
            exit 1
          fi

      - name: 更新 Docker Hub Overview 与短描述
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::DOCKERHUB secrets 未配置，跳过镜像页同步"
            exit 0
          fi
          LOGIN_BODY=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')
          RESP=$(curl -sS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' -d "$LOGIN_BODY")
          JWT=$(printf '%s' "$RESP" | jq -r '.token // empty' 2>/dev/null)
          if [ -z "$JWT" ]; then
            echo "::error::Docker Hub 登录失败（检查 DOCKERHUB secrets；响应开头：$(printf '%s' "$RESP" | head -c 200)）"
            exit 1
          fi
          HTTP_CODE=$(jq -n --arg d "$SHORT_DESCRIPTION" --rawfile f README.hub.md \
            '{description: $d, full_description: $f}' \
            | curl -sS -o /tmp/patch-resp.json -w '%{http_code}' \
              -X PATCH "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$IMAGE_NAME/" \
              -H "Authorization: JWT $JWT" \
              -H 'Content-Type: application/json' \
              -d @-)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Docker Hub PATCH 失败 HTTP $HTTP_CODE：$(head -c 500 /tmp/patch-resp.json)"
            if [ "$HTTP_CODE" = "403" ]; then
              echo "::error::403 通常= PAT 权限不含 Hub 仓库管理写（registry 推送权限不覆盖此项）。去 hub.docker.com → Account Settings → Personal access tokens 生成含 Hub/仓库写权限的 token，更新 GitHub secret DOCKERHUB_TOKEN 后重跑"
            fi
            exit 1
          fi
