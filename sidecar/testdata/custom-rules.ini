; === Smart-SubConverter 自定义规则增强配置 ===
; 格式支持两种（均自动置于规则顶端优先匹配）：
; 1. Subconverter 语法：ruleset=策略组,[]规则类型,匹配值[,额外参数]
; 2. Clash 语法：规则类型,匹配值,策略组[,额外参数]
;
; 注：若目标策略组在所选模板中不存在（如 default 档无 💬 Ai平台），
;     会自动安全降级到 🚀 节点选择，绝不引发客户端配置报错。

; --- 1. AI 平台专属规则补齐（避免被 google 关键词等通用规则截胡）---
ruleset=💬 Ai平台,[]DOMAIN-KEYWORD,cloudcode-pa
ruleset=💬 Ai平台,[]DOMAIN,cloudcode-pa.googleapis.com
ruleset=💬 Ai平台,[]DOMAIN,daily-cloudcode-pa.googleapis.com
ruleset=💬 Ai平台,[]DOMAIN,cloudaicompanion.googleapis.com
ruleset=💬 Ai平台,[]DOMAIN,aiplatform.googleapis.com

